name: CI

# Builds the site and checks the result on every PR (tests/site.test.mjs), then loads the index in
# Chromium (tests/load.e2e.mjs).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the built site
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check the index loads at the top
        run: npm run test:e2e
